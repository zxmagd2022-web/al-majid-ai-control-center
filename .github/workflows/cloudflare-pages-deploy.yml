name: Deploy Control Center to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger this project's Cloudflare Pages deployment
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          set -eu
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not configured; deployment was not triggered."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$CF_PAGES_DEPLOY_HOOK"
